name: Fix duplicate history helper

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate isReturnedIssue functions
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/in/miaolibrary/app/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\n\s*private fun isReturnedIssue\(item: JSONObject\): Boolean \{.*?\n\s*\}\n',
              re.S,
          )
          matches = list(pattern.finditer(text))

          if len(matches) > 1:
              first = matches[0]
              replacement = first.group(0)
              rebuilt = text[:first.start()] + replacement + text[first.end():]
              rebuilt = pattern.sub('', rebuilt)
              rebuilt = rebuilt[:first.start()] + replacement + rebuilt[first.start():]
              text = rebuilt

          path.write_text(text, encoding='utf-8')
          print('Helper definitions found:', len(matches))
          print('Remaining definitions:', len(pattern.findall(text)))

      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo 'No duplicate helper fix needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/in/miaolibrary/app/MainActivity.kt
            git commit -m 'Remove duplicate history helper definitions [skip ci]'
            git push
          fi
