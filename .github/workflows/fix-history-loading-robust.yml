name: Fix Previous Issues loading

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove item-only history identity
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/in/miaolibrary/app/MainActivity.kt
          git diff --cached --quiet || git commit -m 'Fix current loan exclusion from Previous Issues'
          git push
