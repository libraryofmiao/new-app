name: Apply My Books UI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch current-loan history filtering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/in/miaolibrary/app/MainActivity.kt')
          s = p.read_text()

          start = s.index('    private fun isCurrentIssue(item: JSONObject): Boolean {')
          end = s.index('    private fun isReturnedIssue(item: JSONObject): Boolean {', start)

          replacement = '''    private fun isCurrentIssue(item: JSONObject): Boolean {
              if (currentIssueKeys.isEmpty()) return false

              val issueId = first(item, "issue_id", "issueid", "issueId", "checkout_id", "checkoutId", "loan_id", "loanId")
              if (issueId.isNotBlank() && currentIssueKeys.contains("issue:$issueId")) return true

              return issueFingerprints(item).any { currentIssueKeys.contains(it) }
          }

          private fun issueKeys(item: JSONObject): Set<String> {
              val keys = mutableSetOf<String>()

              fun add(prefix: String, value: String) {
                  val v = value.trim()
                  if (v.isNotBlank() && v != "null") keys.add("$prefix:$v")
              }

              val issueId = first(item, "issue_id", "issueid", "issueId", "checkout_id", "checkoutId", "loan_id", "loanId")
              if (issueId.isNotBlank()) add("issue", issueId)
              keys.addAll(issueFingerprints(item))
              return keys
          }

          private fun issueFingerprints(item: JSONObject): Set<String> {
              val result = mutableSetOf<String>()

              fun value(vararg names: String): String = first(item, *names).trim()

              fun datePart(raw: String): String {
                  val v = raw.trim().lowercase()
                  val iso = Regex("\\\\d{4}[-/]\\\\d{2}[-/]\\\\d{2}").find(v)?.value
                  if (iso != null) return iso.replace('/', '-')
                  val dmy = Regex("\\\\d{2}[-/]\\\\d{2}[-/]\\\\d{4}").find(v)?.value
                  if (dmy != null) {
                      val p = dmy.split('-', '/')
                      return "${p[2]}-${p[1]}-${p[0]}"
                  }
                  return v.replace(Regex("[^a-z0-9]"), "")
              }

              val barcode = value("barcode", "item_barcode", "itemBarcode")
              val title = value("title", "name", "book_title", "bookTitle")
              val author = value("author", "authors", "creator")
              val issued = value("checkout_date", "date_issued", "issued_date", "issue_date", "date_checkout", "checkoutDate", "issuedDate")
              val due = value("date_due", "due_date", "duedate", "due", "dueDate")

              val issuedDate = datePart(issued)
              val dueDate = datePart(due)
              val cleanBarcode = barcode.lowercase().replace(Regex("[^a-z0-9]"), "")
              val cleanTitle = title.lowercase().replace(Regex("[^a-z0-9]"), "")
              val cleanAuthor = author.lowercase().replace(Regex("[^a-z0-9]"), "")

              if (cleanBarcode.isNotBlank() && issuedDate.isNotBlank() && dueDate.isNotBlank()) result.add("loan:$cleanBarcode|$issuedDate|$dueDate")
              if (cleanBarcode.isNotBlank() && issuedDate.isNotBlank()) result.add("loan-issued:$cleanBarcode|$issuedDate")
              if (cleanBarcode.isNotBlank() && dueDate.isNotBlank()) result.add("loan-due:$cleanBarcode|$dueDate")
              if (cleanTitle.isNotBlank() && issuedDate.isNotBlank() && dueDate.isNotBlank()) result.add("title-loan:$cleanTitle|$cleanAuthor|$issuedDate|$dueDate")

              return result
          }

'''

          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/in/miaolibrary/app/MainActivity.kt
          git diff --cached --quiet || git commit -m "Fix current loan exclusion from previous issues"
          git push
