name: Fix current loan history filtering

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-history-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch history identity matching
        env:
          REPLACEMENT_B64: 
        run: python3 -c "import os,base64; from pathlib import Path; p=Path('app/src/main/java/in/miaolibrary/app/MainActivity.kt'); s=p.read_text(); a=s.index('    private fun isCurrentIssue(item: JSONObject): Boolean {'); b=s.index('    private fun isReturnedIssue(item: JSONObject): Boolean {',a); r=base64.b64decode(os.environ['REPLACEMENT_B64']).decode(); p.write_text(s[:a]+r+s[b:])"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/in/miaolibrary/app/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use exact loan fingerprints for previous issue filtering"
          git push
