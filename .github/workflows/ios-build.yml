name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS application
        run: |
          xcodebuild -project ios/MiaoLibrary/MiaoLibrary.xcodeproj -scheme MiaoLibrary -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
