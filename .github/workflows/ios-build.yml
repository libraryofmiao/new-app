name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS application
        run: |
          echo '--- PROJECT FILE ---'
          cat ios/MiaoLibrary/MiaoLibrary.xcodeproj/project.pbxproj
          echo '--- PLIST CHECK ---'
          plutil -lint ios/MiaoLibrary/Config/Info.plist
          echo '--- XCODE PROJECT LIST ---'
          xcodebuild -project ios/MiaoLibrary/MiaoLibrary.xcodeproj -list
          test -f ios/MiaoLibrary/MiaoLibrary.xcodeproj/xcshareddata/xcschemes/MiaoLibrary.xcscheme
          echo '--- BUILD ---'
          xcodebuild -project ios/MiaoLibrary/MiaoLibrary.xcodeproj -scheme MiaoLibrary -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

# iOS build trigger
