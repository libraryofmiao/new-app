name: Android build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Home and Account footer change
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/in/miaolibrary/app/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          old_footer = '''    val footer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(0, dp(30), 0, dp(12)) }
    val website = text("Our Official Website : miaolibrary.in", 14f, ink).apply { gravity = Gravity.CENTER; setTypeface(typeface, 1); setOnClickListener { startActivity(android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse("https://miaolibrary.in"))) } }
    footer.addView(website)
    footer.addView(text("© Sub Divisional Library, Miao. All Rights Reserved.", 12f, muted).apply { gravity = Gravity.CENTER; setPadding(0, dp(8), 0, 0) })
    body.addView(footer)
'''

          if old_footer in text:
              text = text.replace(old_footer, '', 1)

          new_account = '''    private fun account(body: LinearLayout) {
        body.addView(card(LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER_HORIZONTAL
            addView(text("Library account", 21f).apply {
                gravity = Gravity.CENTER
                setTypeface(typeface, 1)
            })
            addView(text(username(), 16f, muted).apply {
                gravity = Gravity.CENTER
                setPadding(0, dp(8), 0, 0)
            })
            addView(text("Your Koha patron account", 13f, muted).apply {
                gravity = Gravity.CENTER
                setPadding(0, dp(4), 0, 0)
            })
        }), LinearLayout.LayoutParams(-1, -2).apply {
            setMargins(0, dp(14), 0, dp(16))
        })

        val my = button("View my books", false).apply { textSize = 15f }
        body.addView(my, LinearLayout.LayoutParams(-1, dp(52)).apply {
            setMargins(0, 0, 0, dp(10))
        })
        my.setOnClickListener { dashboard("My Books") }

        val refresh = button("Refresh account", false).apply { textSize = 15f }
        body.addView(refresh, LinearLayout.LayoutParams(-1, dp(52)).apply {
            setMargins(0, 0, 0, dp(10))
        })
        refresh.setOnClickListener { dashboard("Account") }

        val logout = button("Log out", true).apply {
            background = shape(Color.rgb(155, 76, 76), 16)
            textSize = 15f
        }
        body.addView(logout, LinearLayout.LayoutParams(-1, dp(52)))
        logout.setOnClickListener {
            prefs().edit().clear().apply()
            login()
        }

        val footer = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER
            setPadding(0, dp(34), 0, dp(12))
        }

        val website = text("Our Official Website : miaolibrary.in", 14f, ink).apply {
            gravity = Gravity.CENTER
            setTypeface(typeface, 1)
            setOnClickListener {
                startActivity(android.content.Intent(
                    android.content.Intent.ACTION_VIEW,
                    android.net.Uri.parse("https://miaolibrary.in")
                ))
            }
        }

        footer.addView(website)
        footer.addView(text("© Sub Divisional Library, Miao. All Rights Reserved.", 12f, muted).apply {
            gravity = Gravity.CENTER
            setPadding(0, dp(8), 0, 0)
        })
        body.addView(footer)
    }'''

          text, count = re.sub(
              r'    private fun account\(body: LinearLayout\) \{.*?\n    \}\n\n    private fun displayValue',
              new_account + '\n\n    private fun displayValue',
              text,
              count=1,
              flags=re.S,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit source change
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- app/src/main/java/in/miaolibrary/app/MainActivity.kt; then
            echo "No source change needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/in/miaolibrary/app/MainActivity.kt
            git commit -m "Move website footer from Home to Account"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
